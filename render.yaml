services:
  - type: web
    name: localloop-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node server_dist/src/main.js
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: ML_SERVICE_URL
        value: https://localloop-1.onrender.com

  - type: web
    name: localloop-ml
    runtime: python
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
